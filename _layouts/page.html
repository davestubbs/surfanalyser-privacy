<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: 'Carvesense: surf coaching from your own videos.' }}">
<meta name="theme-color" content="#E4F1EE">
<link rel="icon" href="{{ '/assets/icon-64.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/icon-180.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/icon-128.png' | relative_url }}" alt="">Carvesense</a>
    <nav>
      <a class="hide-sm" href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    </nav>
  </div>
</header>
<div class="doc-band" aria-hidden="true">
  <div class="swell">
    <svg class="back" viewBox="0 0 2880 90" preserveAspectRatio="none"><path d="M0 46 Q 360 14 720 46 T 1440 46 T 2160 46 T 2880 46 V90 H0 Z"/></svg>
    <svg class="front" viewBox="0 0 2880 90" preserveAspectRatio="none"><path d="M0 56 Q 360 24 720 56 T 1440 56 T 2160 56 T 2880 56 V90 H0 Z"/></svg>
  </div>
</div>
<main class="doc">
<article class="doc-card">
{{ content }}
</article>
</main>
<footer>
  <div class="wrap">
    <div><a href="{{ '/support/' | relative_url }}">Support</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a><a href="mailto:davestubbs@hotmail.com">Contact</a></div>
    <div>© {{ site.time | date: '%Y' }} David Stubbs</div>
  </div>
</footer>
</body>
</html>
